<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动态 · AI 投研助手</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f7;
      --paper: #ffffff;
      --ink: #1d1d1f;
      --ink-soft: #424245;
      --muted: #6e6e73;
      --faint: #86868b;
      --line: rgba(29, 29, 31, 0.10);
      --line-strong: rgba(29, 29, 31, 0.16);
      --blue: #0071e3;
      --blue-pressed: #0068d1;
      --blue-wash: rgba(0, 113, 227, 0.08);
      --green: #248a3d;
      --green-wash: rgba(36, 138, 61, 0.09);
      --amber: #9a6700;
      --amber-wash: rgba(190, 120, 0, 0.10);
      --red: #d70015;
      --chrome: rgba(250, 250, 252, 0.78);
      --sheet: rgba(255, 255, 255, 0.92);
      --shadow-float: 0 14px 44px rgba(0, 0, 0, 0.09), 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-sheet: -18px 0 60px rgba(0, 0, 0, 0.10), -1px 0 rgba(0, 0, 0, 0.05);
      --content-width: 760px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      font-size: 16px;
      font-optical-sizing: auto;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, textarea { font: inherit; }

    button {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button, [role="button"] { touch-action: manipulation; }

    .app-shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background:
        radial-gradient(circle at 50% -28%, rgba(255, 255, 255, 0.95), transparent 48%),
        var(--canvas);
    }

    .chrome {
      background: var(--chrome);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
    }

    .topbar {
      position: relative;
      z-index: 30;
      height: 64px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
    }

    .topbar::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 18px;
      transform: translateY(100%);
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(245, 245, 247, 0.78), transparent);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: max-content;
      font-size: 17px;
      font-weight: 660;
      letter-spacing: -0.025em;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--ink);
      color: white;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.16);
    }

    .brand-mark svg { width: 15px; height: 15px; }

    .top-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pressable {
      border: 0;
      cursor: pointer;
      transition: transform 180ms cubic-bezier(.2, .8, .2, 1), background-color 180ms ease, color 180ms ease;
    }

    .pressable:active {
      transform: scale(0.97);
      transition: transform 100ms ease-out;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: var(--ink-soft);
    }

    .icon-button:hover { background: rgba(0, 0, 0, 0.045); }
    .icon-button svg { width: 19px; height: 19px; }

    .asset-control { position: relative; justify-self: center; }

    .asset-switcher {
      min-width: 210px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 12px 0 14px;
      border: 1px solid rgba(29, 29, 31, 0.08);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.64);
      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.03), inset 0 1px rgba(255, 255, 255, 0.65);
      font-size: 14px;
      font-weight: 580;
      letter-spacing: -0.01em;
    }

    .asset-switcher:hover { background: rgba(255, 255, 255, 0.9); }
    .asset-switcher svg { width: 14px; height: 14px; color: var(--muted); }

    .asset-popover {
      position: absolute;
      top: calc(100% + 9px);
      left: 50%;
      width: 288px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.68);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: var(--shadow-float);
      transform: translate(-50%, -8px) scale(0.97);
      transform-origin: 50% 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease, transform 260ms cubic-bezier(.2, .8, .2, 1);
    }

    .asset-popover.is-open {
      transform: translate(-50%, 0) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .asset-option {
      width: 100%;
      min-height: 52px;
      display: grid;
      grid-template-columns: 34px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 7px 9px;
      border: 0;
      border-radius: 12px;
      background: transparent;
      text-align: left;
    }

    .asset-option:hover { background: rgba(0, 0, 0, 0.045); }
    .asset-option[aria-checked="true"] { background: var(--blue-wash); }

    .asset-avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      color: white;
      font-size: 12px;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .asset-avatar.tencent { background: linear-gradient(145deg, #2f80ed, #1463c7); }
    .asset-avatar.moutai { background: linear-gradient(145deg, #c52233, #8d1220); }

    .asset-name { display: block; font-size: 14px; font-weight: 620; }
    .asset-kind { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
    .checkmark { color: var(--blue); opacity: 0; }
    .asset-option[aria-checked="true"] .checkmark { opacity: 1; }

    .popover-divider { height: 1px; margin: 7px 8px; background: var(--line); }

    .manage-assets {
      width: 100%;
      height: 42px;
      padding: 0 11px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--blue);
      text-align: left;
      font-size: 14px;
      font-weight: 560;
    }

    .manage-assets:hover { background: var(--blue-wash); }

    .workspace { position: relative; min-height: 0; }

    .conversation-scroll {
      height: 100%;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }

    .conversation {
      width: min(var(--content-width), calc(100% - 48px));
      min-height: 100%;
      margin: 0 auto;
      padding: 74px 0 188px;
    }

    .context-line {
      display: flex;
      align-items: baseline;
      gap: 9px;
      margin-bottom: 34px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.005em;
    }

    .context-line strong { color: var(--ink-soft); font-weight: 620; }
    .context-dot { color: #b7b7bc; }

    .feed-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: -12px 0 38px;
      padding: 11px 13px 11px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.52);
    }

    .feed-status { display: flex; align-items: center; gap: 9px; color: var(--ink-soft); font-size: 12px; font-weight: 590; }
    .feed-pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 4px var(--blue-wash); }
    .simulate-button { min-height: 32px; padding: 0 11px; border: 0; border-radius: 10px; background: var(--blue-wash); color: var(--blue); font-size: 12px; font-weight: 640; cursor: pointer; }

    .push-message {
      margin-bottom: 34px;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.56);
      animation: materialize 260ms cubic-bezier(.2,.8,.2,1);
    }

    .push-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; color: var(--muted); font-size: 11px; }
    .unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 3px var(--blue-wash); }
    .push-priority { padding: 3px 7px; border-radius: 999px; background: var(--amber-wash); color: var(--amber); font-weight: 640; }
    .push-message h2 { margin-top: 12px; }
    .push-summary { margin: 9px 0 0; color: var(--ink-soft); font-size: 14px; line-height: 1.62; }
    .push-reason { margin: 12px 0 0; padding-top: 11px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 1.5; }

    .thinking-state { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .thinking-dots { display: inline-flex; gap: 3px; }
    .thinking-dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: thinking 1s ease-in-out infinite; }
    .thinking-dots i:nth-child(2) { animation-delay: .14s; }
    .thinking-dots i:nth-child(3) { animation-delay: .28s; }
    @keyframes thinking { 0%, 70%, 100% { opacity: .28; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-2px); } }

    .stream-cursor::after { content: ""; display: inline-block; width: 2px; height: 1em; margin-left: 3px; vertical-align: -.15em; background: var(--blue); animation: blink .8s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .stopped-note { margin-top: 10px; color: var(--muted); font-size: 11px; }

    .message { position: relative; margin: 0 0 38px; }

    .message.assistant { padding-right: 34px; }

    .assistant-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 13px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 590;
      letter-spacing: 0.035em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 4px var(--amber-wash);
    }

    .status-dot.uncertain { background: var(--faint); box-shadow: 0 0 0 4px rgba(110, 110, 115, 0.10); }
    .status-dot.support { background: var(--green); box-shadow: 0 0 0 4px var(--green-wash); }

    .message h1 {
      max-width: 700px;
      margin: 0;
      font-size: clamp(29px, 3vw, 38px);
      line-height: 1.17;
      letter-spacing: -0.034em;
      font-weight: 680;
    }

    .message h2 {
      margin: 0;
      font-size: 21px;
      line-height: 1.3;
      letter-spacing: -0.022em;
      font-weight: 650;
    }

    .lede {
      max-width: 660px;
      margin: 19px 0 0;
      color: var(--ink-soft);
      font-size: 17px;
      line-height: 1.65;
      letter-spacing: -0.006em;
    }

    .impact-line {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 23px;
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.5;
    }

    .impact-pill {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      color: var(--amber);
      background: var(--amber-wash);
      font-size: 12px;
      font-weight: 660;
      letter-spacing: .01em;
    }

    .impact-pill.uncertain { color: var(--muted); background: rgba(110,110,115,.09); }
    .impact-pill.support { color: var(--green); background: var(--green-wash); }

    .message-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 27px;
    }

    .text-button, .prompt-chip {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.66);
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 570;
    }

    .prompt-chip { padding: 0 14px; }
    .text-button { padding: 0 12px; color: var(--blue); }
    .prompt-chip:hover, .text-button:hover { background: white; border-color: var(--line-strong); }

    .user-message {
      width: fit-content;
      max-width: 72%;
      margin-left: auto;
      padding: 11px 15px;
      border-radius: 18px 18px 5px 18px;
      background: var(--ink);
      color: white;
      font-size: 15px;
      line-height: 1.55;
      box-shadow: 0 3px 10px rgba(0,0,0,.08);
    }

    .answer-copy {
      max-width: 680px;
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.72;
    }

    .answer-copy p { margin: 0 0 14px; }

    .analysis {
      max-width: 680px;
      margin-top: 24px;
      border-top: 1px solid var(--line);
    }

    .analysis[hidden] { display: none; }

    .analysis-row {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 18px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line);
    }

    .analysis-label { color: var(--muted); font-size: 13px; font-weight: 620; }
    .analysis-value { color: var(--ink-soft); font-size: 14px; line-height: 1.65; }

    .source-line {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .source-line button {
      padding: 0;
      border: 0;
      background: none;
      color: var(--blue);
      cursor: pointer;
    }

    .composer-dock {
      position: absolute;
      z-index: 20;
      inset: auto 0 0;
      padding: 32px 24px 22px;
      pointer-events: none;
      background: linear-gradient(to top, var(--canvas) 46%, rgba(245,245,247,0.88) 70%, transparent);
    }

    .composer {
      position: relative;
      width: min(var(--content-width), calc(100% - 48px));
      min-height: 62px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 12px;
      margin: 0 auto;
      padding: 10px 10px 10px 18px;
      border: 1px solid rgba(29,29,31,.11);
      border-radius: 22px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      box-shadow: var(--shadow-float);
      pointer-events: auto;
    }

    .composer:focus-within { border-color: rgba(0,113,227,.38); box-shadow: 0 14px 44px rgba(0,0,0,.09), 0 0 0 4px rgba(0,113,227,.08); }

    .composer textarea {
      width: 100%;
      min-height: 40px;
      max-height: 128px;
      padding: 9px 0 7px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
    }

    .composer textarea::placeholder { color: #9a9aa0; }

    .send-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      box-shadow: inset 0 1px rgba(255,255,255,.22);
    }

    .send-button:hover { background: var(--blue-pressed); }
    .send-button svg { width: 17px; height: 17px; }
    .send-button.is-generating { background: var(--ink); }
    .send-button.is-generating svg { width: 12px; height: 12px; }

    .composer-note {
      width: min(var(--content-width), calc(100% - 48px));
      margin: 8px auto 0;
      color: var(--faint);
      text-align: center;
      font-size: 11px;
      letter-spacing: .005em;
      pointer-events: auto;
    }

    .sheet {
      position: fixed;
      z-index: 50;
      inset: 0 0 0 auto;
      width: min(560px, 96vw);
      display: grid;
      grid-template-rows: auto minmax(0,1fr);
      border-left: 1px solid rgba(255,255,255,.7);
      background: var(--sheet);
      backdrop-filter: blur(30px) saturate(170%);
      -webkit-backdrop-filter: blur(30px) saturate(170%);
      box-shadow: var(--shadow-sheet);
      transform: translate3d(104%, 0, 0);
      opacity: .96;
      visibility: hidden;
      transition: transform 380ms cubic-bezier(.2,.8,.2,1), opacity 260ms ease, visibility 0s linear 380ms;
      will-change: transform;
    }

    .sheet.is-open {
      transform: translate3d(0, 0, 0);
      opacity: 1;
      visibility: visible;
      transition: transform 380ms cubic-bezier(.2,.8,.2,1), opacity 260ms ease;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      padding: 16px 18px 10px 24px;
    }

    .sheet-title { margin: 0; font-size: 20px; line-height: 1.25; letter-spacing: -.025em; font-weight: 670; }
    .sheet-body { overflow: auto; padding: 10px 24px 40px; }

    .sheet-intro { margin: 0 0 25px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .detail-section { padding: 20px 0; border-top: 1px solid var(--line); }
    .detail-section:first-of-type { border-top: 0; padding-top: 2px; }
    .detail-section h3 { margin: 0 0 9px; font-size: 14px; line-height: 1.4; letter-spacing: -.01em; }
    .detail-section p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.65; }

    .detail-eyebrow {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .evidence-meta { display: flex; gap: 8px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .evidence-quote { margin-top: 13px !important; padding-left: 13px; border-left: 2px solid var(--line-strong); }

    .data-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 5px;
      margin: -2px -5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: inherit;
      font: inherit;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .data-link:hover { background: var(--blue-wash); color: var(--blue); }
    .data-link::after { content: "↗"; font-size: .72em; color: var(--blue); opacity: .72; }

    .conclusion-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 23px;
    }

    .conclusion-row .impact-line { margin-top: 0; }

    .detail-link {
      min-height: 30px;
      padding: 0 10px;
      border: 0;
      border-radius: 9px;
      background: var(--blue-wash);
      color: var(--blue);
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    .sheet-heading-group { min-width: 0; }
    .sheet-context { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 520; }
    .sheet-header-actions { display: flex; align-items: center; gap: 4px; }

    .sheet-back {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--blue);
      cursor: pointer;
    }

    .sheet-back:hover { background: var(--blue-wash); }
    .sheet-back svg { width: 18px; height: 18px; }

    .archive-tabs {
      position: sticky;
      z-index: 4;
      top: -10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin: 0 0 24px;
      padding: 3px;
      border-radius: 12px;
      background: rgba(118,118,128,.12);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .archive-tab {
      min-height: 32px;
      padding: 0 8px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-weight: 610;
      cursor: pointer;
    }

    .archive-tab[aria-selected="true"] {
      background: rgba(255,255,255,.94);
      color: var(--ink);
      box-shadow: 0 1px 4px rgba(0,0,0,.1);
    }

    .archive-panel { animation: materialize 220ms cubic-bezier(.2,.8,.2,1); }

    @keyframes materialize {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .archive-summary {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: start;
      padding: 18px;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.58);
    }

    .archive-summary strong { display: block; font-size: 16px; line-height: 1.4; }
    .archive-summary p { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .confidence-value { color: var(--green); font-size: 22px; line-height: 1; font-weight: 680; font-variant-numeric: tabular-nums; }
    .confidence-label { display: block; margin-top: 6px; color: var(--muted); text-align: right; font-size: 10px; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-card {
      min-height: 92px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(255,255,255,.58);
      text-align: left;
      cursor: pointer;
    }

    .metric-card:hover { border-color: rgba(0,113,227,.25); background: rgba(255,255,255,.92); }
    .metric-card-label { display: block; color: var(--muted); font-size: 11px; font-weight: 620; }

    function buildMarketSeries(seed, basePrice, count = 96) {
      const points = [];
      const end = new Date("2026-09-08T12:00:00");
      const dates = [];
      const cursor = new Date(end);
      while (dates.length < count) {
        if (cursor.getDay() !== 0 && cursor.getDay() !== 6) dates.unshift(new Date(cursor));
        cursor.setDate(cursor.getDate() - 1);
      }
      let last = basePrice * .83;
      dates.forEach((date, index) => {
        const wave = Math.sin((index + seed) * .39) * .011 + Math.cos((index + seed * 2) * .17) * .007;
        const drift = .0018 + Math.sin((index + seed) * .071) * .0016;
        const open = last * (1 + Math.sin(index * .73 + seed) * .004);
        const close = open * (1 + wave + drift);
        const spread = .008 + Math.abs(Math.sin(index * .51 + seed)) * .009;
        points.push({
          date: date.toISOString().slice(0, 10),
          open,
          high: Math.max(open, close) * (1 + spread),
          low: Math.min(open, close) * (1 - spread * .82),
          close,
          volume: Math.round((18 + Math.abs(Math.sin(index * .31 + seed)) * 24 + (index % 13 === 0 ? 19 : 0)) * 1000000)
        });
        last = close;
      });
      const ratio = basePrice / points.at(-1).close;
      return points.map(point => ({
        ...point,
        open: +(point.open * ratio).toFixed(2),
        high: +(point.high * ratio).toFixed(2),
        low: +(point.low * ratio).toFixed(2),
        close: +(point.close * ratio).toFixed(2)
      }));
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    }

    function metricButton(asset, metricKey, text = null, className = "data-link") {
      const metric = asset.metrics[metricKey];
      if (!metric) return escapeHtml(text || "—");
      return `<button class="${className} pressable" type="button" data-metric="${metricKey}" aria-label="查看${metric.label}的数据详情">${escapeHtml(text || metric.value)}</button>`;
    }

    function aggregateSeries(series, period = "day") {
      const groupSize = period === "week" ? 5 : period === "month" ? 20 : 1;
      const grouped = [];
      for (let index = 0; index < series.length; index += groupSize) {
        const group = series.slice(index, index + groupSize);
        if (!group.length) continue;
        grouped.push({
          date: group.at(-1).date,
          open: group[0].open,
          high: Math.max(...group.map(point => point.high)),
          low: Math.min(...group.map(point => point.low)),
          close: group.at(-1).close,
          volume: group.reduce((sum, point) => sum + point.volume, 0)
        });
      }
      const limits = { day: 38, week: 20, month: 12 };
      return grouped.slice(-limits[period]);
    }

    function formatCompactVolume(value) {
      if (value >= 100000000) return `${(value / 100000000).toFixed(1)}亿`;
      if (value >= 10000) return `${(value / 10000).toFixed(0)}万`;
      return String(value);
    }

    function renderCandlestickChart(asset, period = "day") {
      const data = aggregateSeries(asset.marketSeries, period);
      if (data.length < 2) return '<div class="detail-section"><p>当前周期的数据点不足，指标摘要仍可查看。</p></div>';
      const width = 500;
      const height = 300;
      const plotLeft = 10;
      const plotRight = 450;
      const priceTop = 16;
      const priceBottom = 202;
      const volumeTop = 224;
      const volumeBottom = 276;
      const minPrice = Math.min(...data.map(point => point.low));
      const maxPrice = Math.max(...data.map(point => point.high));
      const maxVolume = Math.max(...data.map(point => point.volume));
      const priceRange = Math.max(.01, maxPrice - minPrice);
      const xStep = (plotRight - plotLeft) / data.length;
      const candleWidth = Math.max(3, Math.min(9, xStep * .58));
      const xAt = index => plotLeft + xStep * index + xStep / 2;
      const yAt = value => priceBottom - ((value - minPrice) / priceRange) * (priceBottom - priceTop);
      const grid = Array.from({ length: 5 }, (_, index) => {
        const ratio = index / 4;
        const y = priceTop + ratio * (priceBottom - priceTop);
        const price = maxPrice - ratio * priceRange;
        return `<line class="chart-grid-line" x1="${plotLeft}" y1="${y}" x2="${plotRight}" y2="${y}"/><text class="chart-axis-label" x="458" y="${y + 3}">${price.toFixed(1)}</text>`;
      }).join("");
      const candles = data.map((point, index) => {
        const x = xAt(index);
        const openY = yAt(point.open);
        const closeY = yAt(point.close);
        const highY = yAt(point.high);
        const lowY = yAt(point.low);
        const up = point.close >= point.open;
        const className = up ? "chart-candle-up" : "chart-candle-down";
        const bodyY = Math.min(openY, closeY);
        const bodyHeight = Math.max(1.5, Math.abs(closeY - openY));
        const volumeHeight = point.volume / maxVolume * (volumeBottom - volumeTop);
        return `<g><title>${point.date} 开 ${point.open.toFixed(2)} 高 ${point.high.toFixed(2)} 低 ${point.low.toFixed(2)} 收 ${point.close.toFixed(2)} 量 ${formatCompactVolume(point.volume)}</title><line class="${className}" x1="${x}" y1="${highY}" x2="${x}" y2="${lowY}"/><rect class="${className}" x="${x - candleWidth / 2}" y="${bodyY}" width="${candleWidth}" height="${bodyHeight}" rx=".7"/><rect class="chart-volume" x="${x - candleWidth / 2}" y="${volumeBottom - volumeHeight}" width="${candleWidth}" height="${volumeHeight}" rx="1"/></g>`;
      }).join("");
      const movingAverage = data.map((point, index) => {
        const window = data.slice(Math.max(0, index - 4), index + 1);
        return { x: xAt(index), y: yAt(window.reduce((sum, item) => sum + item.close, 0) / window.length) };
      });
      const maPath = movingAverage.map((point, index) => `${index ? "L" : "M"}${point.x.toFixed(1)},${point.y.toFixed(1)}`).join(" ");
      const eventMarks = asset.events.map((event, index) => {
        const x = plotLeft + ((event.index % asset.marketSeries.length) / (asset.marketSeries.length - 1)) * (plotRight - plotLeft);
        const y = 24 + (index % 2) * 12;
        return `<g><title>${event.title}</title><line class="chart-event-line" x1="${x}" y1="${y + 7}" x2="${x}" y2="${priceBottom}"/><circle class="chart-event-dot" cx="${x}" cy="${y}" r="4"/></g>`;
      }).join("");
      const firstDate = data[0].date.slice(5);
      const lastDate = data.at(-1).date.slice(5);
      return `
        <svg class="chart-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="${asset.name}${period === "day" ? "日" : period === "week" ? "周" : "月"}K线、成交量、五期均线与事件标记">
          ${grid}
          <line class="chart-grid-line" x1="${plotLeft}" y1="${volumeTop}" x2="${plotRight}" y2="${volumeTop}"/>
          ${candles}
          <path class="chart-ma" d="${maPath}"/>
          ${eventMarks}
          <text class="chart-axis-label" x="${plotLeft}" y="294">${firstDate}</text>
          <text class="chart-axis-label" x="${plotRight}" y="294" text-anchor="end">${lastDate}</text>
        </svg>
        <div class="chart-legend"><span class="legend-item"><i class="legend-swatch"></i>五期均线</span><span class="legend-item"><i class="legend-swatch volume"></i>成交量</span><span class="legend-item"><i class="legend-swatch event"></i>关键事件</span></div>
      `;
    }

          id,
          statusClass: "uncertain",
          segments: [`<p><strong>我不能替你决定是否买入或卖出。</strong></p>`, `<p>当前信息被标记为“${asset.status}”，这不等于研究档案中的判断已经成立或失效。</p>`, `<p>更稳妥的下一步是核验 ${metricButton(asset, Object.keys(asset.metrics)[5] || "price")} 与判断失效条件，再由你决定。</p>`],
          analysis: asset.analysis,
          traceId: "primary"
        };
      }
      if (/证据|来源|相关信息|原文/.test(text)) {
        return { id, segments: [`<p>研究档案中当前有 <strong>${asset.sources.length} 个来源</strong>，包括一级来源、站内结构化数据和低可信线索。</p>`, `<p>一级来源优先支持事实；不可用或未经确认的材料只保留为线索，不进入确定结论。</p>`, `<p><button class="text-button pressable" type="button" data-archive-tab="sources">打开来源记录</button></p>`], traceId: "primary" };
      }
      if (/估值|市盈率|分位/.test(text)) {
        return { id, segments: [`<p>${asset.reasoning.valuation.conclusion.title}。</p>`, `<p>${asset.reasoning.valuation.conclusion.summary}</p>`, `<p>当前模拟指标为 ${metricButton(asset, "valuation")}；它只是一项条件，不能单独推出交易结论。</p>`], analysis: asset.analysis, traceId: "valuation" };
      }
      if (/成交|量价|股价|价格|波动|基本面变化/.test(text)) {
        const traceId = asset.reasoning.volatility ? "volatility" : "primary";
        return { id, segments: [`<p>${asset.reasoning[traceId].conclusion.title}。</p>`, `<p>当前 ${metricButton(asset, "change")}，${metricButton(asset, "volume")}。量能提高了跟踪价值，但没有证明基本面已经变化。</p>`, `<p>需要等待连续行情、公司披露或经营指标共同确认。</p>`], analysis: asset.analysis, traceId };
      }
      if (/渠道|库存|批价/.test(text) && asset.reasoning.channel) {
        return { id, segments: [`<p>${asset.reasoning.channel.conclusion.title}。</p>`, `<p>当前批价 ${metricButton(asset, "wholesale")}；样本库存 ${metricButton(asset, "inventory")}，两项信号方向偏弱。</p>`, `<p>但样本覆盖与持续时间不足，当前只提高观察频率，不直接修改长期判断。</p>`], analysis: asset.analysis, traceId: "channel" };
      }
      if (/判断|逻辑|影响/.test(text)) {
        return {
          id,
          segments: [`<p><strong>${asset.status}。</strong>${asset.analysis.inference}</p>`, `<p>AI 不会自动改写你的判断。你可以在研究档案中对照新证据、失效条件和仍不确定的信息。</p>`, `<p><button class="text-button pressable" type="button" data-sheet="impact">对照原判断</button></p>`],
          analysis: asset.analysis,
          traceId: "primary"
        };
      }
      if (/为什么|重要/.test(text)) {
        return { id, segments: [`<p>${asset.analysis.inference}</p>`, `<p>重要性来自它与研究档案中关键变量的连接，而不是单日涨跌本身。</p>`, `<p>如果相关数据连续变化并接近判断失效条件，系统才会提高结论等级。</p>`], analysis: asset.analysis, traceId: "primary" };
      }
      if (/观察|后续|接下来|核验|未知/.test(text)) {
        return { id, segments: [`<p><strong>接下来重点看：</strong>${asset.analysis.next}</p>`, `<p>判断更新的门槛是多项证据连续同向，而不是一次异常。</p>`, `<p>研究档案会保留当前结论、未知项和后续验证条件，便于下次对照。</p>`], analysis: asset.analysis, traceId: "primary" };
      }
      return {
        id,
        segments: [`<p>基于当前 <strong>${asset.sources.length} 个来源</strong>和 ${Object.keys(asset.metrics).length} 个关键指标，当前结论仍是“${asset.status}”。</p>`, `<p>${asset.analysis.inference}</p>`, `<p>你可以继续追问重要性、证据边界、估值或它是否影响原判断。</p>`],
        analysis: asset.analysis,
        traceId: "primary"
      };
    }

    function appendUserMessage(text) {
      state.messages[state.assetId].push({ role: "user", text });
    }

    function setGeneratingUI(isGenerating) {
      state.generating = isGenerating;
      sendButton.classList.toggle("is-generating", isGenerating);
      sendButton.setAttribute("aria-label", isGenerating ? "停止生成" : "发送");
      sendButton.innerHTML = isGenerating
        ? '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="2" fill="currentColor"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }

    function stopStreamingAnswer() {
      if (!state.generating) return;
      clearTimeout(state.generationTimer);
      state.generationToken += 1;
      const messages = state.messages[state.assetId];
      const current = [...messages].reverse().find(message => message.role === "assistant" && message.streaming);
      if (current) {
        current.streaming = false;
        current.stage = "stopped";
        if (!current.html) current.html = "<p>回答已在生成前停止。</p>";
      }
      setGeneratingUI(false);
      renderConversation();
    }

    function scrollConversationToEnd(behavior = "smooth") {
      requestAnimationFrame(() => conversationScroll.scrollTo({ top: conversationScroll.scrollHeight, behavior }));
    }

    function startStreamingAnswer(answer) {
      const token = ++state.generationToken;
      const targetAssetId = state.assetId;
      const segments = answer.segments || ["<p>暂时没有可用回答。</p>"];
      const message = { role: "assistant", ...answer, html: "", stage: "understanding", streaming: true };
      delete message.segments;
      state.messages[targetAssetId].push(message);
      setGeneratingUI(true);
      renderConversation();
      scrollConversationToEnd();
      state.generationTimer = setTimeout(() => {
        if (token !== state.generationToken) return;
        message.stage = "retrieving";
        renderConversation();
        scrollConversationToEnd();
        state.generationTimer = setTimeout(() => {
          if (token !== state.generationToken) return;
          message.stage = "streaming";
          let index = 0;
          const appendSegment = () => {
            if (token !== state.generationToken) return;
            message.html += segments[index];
            index += 1;
            renderConversation();
            scrollConversationToEnd("auto");
            if (index < segments.length) {
              state.generationTimer = setTimeout(appendSegment, 430);
            } else {
              message.streaming = false;
              message.stage = "complete";
              if (state.assetId === targetAssetId) {
                setGeneratingUI(false);
                renderConversation();
                scrollConversationToEnd();
              }
            }
          };
          appendSegment();
        }, 620);
      }, 480);
    }

    function ask(prompt) {
      const cleanPrompt = String(prompt).trim();
      if (!cleanPrompt) return;
      if (state.generating) stopStreamingAnswer();
      appendUserMessage(cleanPrompt);
      startStreamingAnswer(resolveAnswer(cleanPrompt));
    }

    function triggerPush(assetId = state.assetId, manual = true) {
      const asset = assets[assetId];
      const cursor = state.pushCursor[assetId] % asset.pushes.length;
      const push = asset.pushes[cursor];
      state.pushCursor[assetId] = cursor + 1;
      const visible = state.visiblePushes[assetId];
      const existingIndex = visible.indexOf(push.id);
      if (existingIndex >= 0) visible.splice(existingIndex, 1);
      visible.push(push.id);
      if (visible.length > 7) visible.shift();
      if (state.assetId === assetId) {
        renderConversation();
        scrollConversationToEnd();
        showToast(manual ? `已模拟推送：${push.title}` : `收到 AI 动态：${push.title}`);
      }
    }

    function openAssetPopover() {
      state.popoverOpen = true;
      assetPopover.classList.add("is-open");
      assetSwitcher.setAttribute("aria-expanded", "true");
    }

    function closeAssetPopover() {
      state.popoverOpen = false;
      assetPopover.classList.remove("is-open");
      assetSwitcher.setAttribute("aria-expanded", "false");
    }

    function sheetFrame(title, intro, body, options = {}) {
      return `
        <div class="sheet-header chrome">
          <div class="sheet-heading-group"><h2 class="sheet-title" id="sheet-title" tabindex="-1">${title}</h2>${options.context ? `<span class="sheet-context">${options.context}</span>` : ""}</div>
          <div class="sheet-header-actions">
            ${options.back ? '<button class="sheet-back pressable" type="button" data-sheet-back aria-label="返回上一层"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14.5 5-7 7 7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' : ""}
            <button class="icon-button pressable" type="button" data-close-sheet aria-label="关闭">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>
        <div class="sheet-body">
          ${intro ? `<p class="sheet-intro">${intro}</p>` : ""}
          ${body}
        </div>
      `;
    }

    function archiveTabsMarkup(active) {
      const tabs = [["thesis", "判断"], ["data", "数据"], ["reasoning", "推断"], ["sources", "来源"]];
      return `<div class="archive-tabs" role="tablist" aria-label="研究档案分类">${tabs.map(([id, label]) => `<button class="archive-tab pressable" type="button" role="tab" data-archive-tab="${id}" aria-selected="${active === id}">${label}</button>`).join("")}</div>`;
    }

    function thesisPanel(asset) {
      return `
        <div class="archive-panel" role="tabpanel">
          <div class="archive-summary"><div><strong>${asset.thesis.core}</strong><p>${asset.thesis.state} · 关注周期 ${asset.thesis.horizon}</p></div><div><span class="confidence-value">${asset.reasoning.primary.conclusion.confidence}%</span><span class="confidence-label">当前置信度</span></div></div>
          <section class="detail-section"><span class="detail-eyebrow">重点观察</span><p>${asset.thesis.watch}</p></section>
          <section class="detail-section"><span class="detail-eyebrow">判断失效条件</span><p>${asset.thesis.invalid}</p></section>
          <section class="detail-section"><span class="detail-eyebrow">最新检查</span><p>${asset.reasoning.primary.conclusion.summary}</p><div class="button-row"><button class="secondary-button pressable" type="button" data-trace="primary">查看推断链</button></div></section>
          <div class="button-row"><button class="primary-button pressable" type="button" data-edit-thesis>编辑我的判断</button></div>
        </div>`;
    }

    function dataPanel(asset) {
      return `<div class="archive-panel" role="tabpanel"><div class="metric-grid">${Object.entries(asset.metrics).map(([key, metric]) => `
        <button class="metric-card pressable" type="button" data-metric="${key}">
          <span class="metric-card-label">${metric.label}</span>
          <span class="metric-card-value">${metric.value}</span>
          <span class="metric-card-delta ${metric.tone || ""}">${metric.delta}</span>
        </button>`).join("")}</div><section class="detail-section"><span class="detail-eyebrow">数据说明</span><p>共展示 ${asset.marketSeries.length} 个交易日与 ${Object.keys(asset.metrics).length} 个关键指标。全部为确定性模拟数据，仅用于交互演示。</p></section></div>`;
    }

    function citationMarkup(citations) {
      return `<div class="button-row">${citations.map(citation => `<button class="secondary-button pressable" type="button" ${citation.type === "metric" ? `data-metric="${citation.target}"` : `data-source-id="${citation.target}"`}>${citation.type === "metric" ? "站内数据" : "来源"} · ${citation.label}</button>`).join("")}</div>`;
    }

    function reasoningPanel(asset, traceId = "primary") {
      const trace = asset.reasoning[traceId] || asset.reasoning.primary;
      return `<div class="archive-panel" role="tabpanel">
        <div class="archive-summary"><div><strong>${trace.conclusion.title}</strong><p>${trace.conclusion.summary}</p></div><div><span class="confidence-value">${trace.conclusion.confidence}%</span><span class="confidence-label">证据置信度</span></div></div>
        <div class="reasoning-chain">${trace.nodes.map((node, index) => `
          <section class="reasoning-node">
            <div class="reasoning-rail"><span class="reasoning-index">${String(index + 1).padStart(2, "0")}</span></div>
            <div class="reasoning-content"><span class="detail-eyebrow">${node.kind}</span><h3>${node.title}</h3><p>${node.detail}</p>${citationMarkup(node.citations)}</div>
          </section>`).join("")}</div>
        <section class="detail-section"><span class="detail-eyebrow">结论变化条件</span><p>${asset.thesis.invalid}</p></section>
      </div>`;
    }

    function sourceRecordMarkup(asset) {
      return `<div class="archive-panel" role="tabpanel">${asset.sources.map(source => `
        <section class="detail-section">
          <span class="detail-eyebrow">${source.level} · ${source.type === "internal" ? "站内" : "站外"}</span>
          <h3>${source.title}</h3>
          <p class="evidence-quote">“${source.quote}”</p>
          <div class="evidence-meta"><span>${source.publisher}</span><span>·</span><span>${source.time}</span><span>·</span><span>${source.status === "available" ? "可核验" : "原文暂不可用"}</span></div>
          <div class="source-record-relates">关联：${source.relates}</div>
          <div class="button-row"><button class="secondary-button pressable" type="button" data-source-id="${source.id}">查看详情</button></div>
        </section>`).join("")}</div>`;
    }

    function researchArchiveSheet(asset, tab = "thesis", traceId = "primary") {
      state.archiveTab = tab;
      const panels = {
        thesis: () => thesisPanel(asset),
        data: () => dataPanel(asset),
        reasoning: () => reasoningPanel(asset, traceId),
        sources: () => sourceRecordMarkup(asset)
      };
      return sheetFrame("研究档案", "你的判断、数据、AI 推断和原始来源集中在这里。模拟数据仅用于演示。", archiveTabsMarkup(tab) + (panels[tab] || panels.thesis)(), { context: `${asset.name} · ${asset.code}` });
    }

    function marketSheet(asset, metricKey = "price", period = "day") {
      const metric = asset.metrics[metricKey] || asset.metrics.price;
      state.chartPeriod = period;
      const periodNames = { day: "日", week: "周", month: "月" };
      return sheetFrame(
        `${metric.label} · 数据详情`,
        "点击任意结构化数值都会进入对应数据视图。K 线、成交量、均线与事件均为模拟数据。",
        `<div class="archive-panel">
          <div class="chart-hero"><div class="chart-hero-label">${asset.name} · ${asset.code}</div><div class="chart-hero-value">${metric.value}</div><div class="chart-hero-meta">${metric.delta} · 更新于 ${asset.updated}</div></div>
          <div class="chart-toolbar"><div class="period-control" aria-label="K 线周期">${Object.entries(periodNames).map(([id, label]) => `<button class="period-button pressable" type="button" data-chart-period="${id}" data-metric-key="${metricKey}" aria-pressed="${period === id}">${label}</button>`).join("")}</div><span class="chart-status">${aggregateSeries(asset.marketSeries, period).length} 根${periodNames[period]}K</span></div>
          <div class="chart-shell">${renderCandlestickChart(asset, period)}</div>
          <section class="detail-section"><span class="detail-eyebrow">相关维度</span><div class="metric-grid">${Object.entries(asset.metrics).filter(([key]) => key !== metricKey).slice(0, 4).map(([key, item]) => `<button class="metric-card pressable" type="button" data-metric="${key}"><span class="metric-card-label">${item.label}</span><span class="metric-card-value">${item.value}</span><span class="metric-card-delta ${item.tone || ""}">${item.delta}</span></button>`).join("")}</div></section>
          <section class="detail-section"><span class="detail-eyebrow">关键事件</span><div class="event-list">${asset.events.map(event => `<div class="event-item"><span class="event-date">${asset.marketSeries[event.index]?.date.slice(5) || "近期"}</span><span class="event-title">${event.title}</span></div>`).join("")}</div></section>
          <section class="detail-section"><span class="detail-eyebrow">数据来源</span><p>${asset.sources.find(source => source.id === metric.sourceId)?.title || "站内模拟数据库"}</p><div class="button-row"><button class="secondary-button pressable" type="button" data-source-id="${metric.sourceId}">查看数据口径与来源</button></div></section>
        </div>`,
        { back: state.sheetHistory.length > 0, context: `${periodNames[period]}K · ${asset.marketSeries.length} 个交易日` }
      );
    }

    function reasoningSheet(asset, traceId = "primary") {
      const trace = asset.reasoning[traceId] || asset.reasoning.primary;
      return sheetFrame("结论推断链", "每一步都区分事实与推断，并可继续追溯站内数据或站外来源。", reasoningPanel(asset, traceId), { back: state.sheetHistory.length > 0, context: `${asset.name} · ${trace.conclusion.state}` });
    }

    function sourceDetailSheet(asset, sourceId) {
      const source = asset.sources.find(item => item.id === sourceId);
      if (!source) return researchArchiveSheet(asset, "sources");
      const action = source.type === "internal"
        ? `<button class="primary-button pressable" type="button" data-metric="${source.metricKey || "price"}">打开站内数据</button>`
        : source.status === "available"
          ? `<a class="primary-button pressable" href="${source.url}" target="_blank" rel="noopener noreferrer">打开站外原文</a>`
          : `<button class="secondary-button" type="button" disabled>站外原文暂不可用</button>`;
      return sheetFrame("来源详情", "来源状态、引用片段与关联对象均保留在研究档案中。", `
        <div class="archive-panel"><section class="detail-section"><span class="detail-eyebrow">${source.level} · ${source.type === "internal" ? "站内结构化数据" : "站外资料"}</span><h3>${source.title}</h3><p class="evidence-quote">“${source.quote}”</p><div class="evidence-meta"><span>${source.publisher}</span><span>·</span><span>${source.time}</span><span>·</span><span>${source.status === "available" ? "可核验" : "原文暂不可用"}</span></div></section><section class="detail-section"><span class="detail-eyebrow">关联内容</span><p>${source.relates}</p><div class="button-row">${action}</div></section><section class="detail-section"><span class="detail-eyebrow">原型说明</span><p>引用内容与数值均为模拟数据。外部地址只用于演示站外溯源路径，不代表该页面包含上述模拟内容。</p></section></div>`,
        { back: true, context: `${asset.name} · ${source.publisher}` }
      );
    }

    function evidenceSheet(asset) {
      return sheetFrame(
        "来源与证据",
        `以下为用于原型测试的模拟资料。系统优先展示权威来源，并保留发布时间和对应原文。`,
        asset.sources.map(source => `
          <section class="detail-section">
            <span class="detail-eyebrow">${source.level}</span>
            <h3>${source.title}</h3>
            <p class="evidence-quote">“${source.quote}”</p>
            <div class="evidence-meta"><span>${source.time}</span><span>·</span><span>${asset.code}</span></div>
            <div class="button-row"><button class="secondary-button pressable" type="button" data-toast="原型使用模拟资料，未连接外部原文">查看原文</button></div>
          </section>
        `).join("") + `
          <section class="detail-section">
            <h3>证据边界</h3>
            <p>${asset.analysis.unknown}</p>
          </section>
        `
      );
    }

    function thesisSheet(asset, editing = false) {
      const body = editing ? `
        <section class="detail-section">
          <label for="thesis-core"><span class="detail-eyebrow">核心判断</span></label>
          <textarea id="thesis-core" class="sheet-textarea">${asset.thesis.core}</textarea>
          <div class="button-row">
            <button class="primary-button pressable" type="button" data-save-thesis>保存判断</button>
            <button class="secondary-button pressable" type="button" data-sheet="thesis">取消</button>
          </div>
        </section>
      ` : `
        <section class="detail-section"><span class="detail-eyebrow">核心判断</span><p>${asset.thesis.core}</p></section>
        <section class="detail-section"><span class="detail-eyebrow">重点观察</span><p>${asset.thesis.watch}</p></section>
        <section class="detail-section"><span class="detail-eyebrow">判断失效条件</span><p>${asset.thesis.invalid}</p></section>
        <section class="detail-section"><span class="detail-eyebrow">关注周期</span><p>${asset.thesis.horizon}</p></section>
        <div class="button-row"><button class="primary-button pressable" type="button" data-edit-thesis>编辑我的判断</button></div>
      `;
      return sheetFrame("我的判断", `${asset.name} · ${asset.thesis.state}。AI 可以协助起草，但只有你能确认或修改。`, body);
    }

    function impactSheet(asset) {
      return sheetFrame(
        "可能影响原判断",
        "新信息只作为检查入口，系统不会自动改写你的判断。",
        `
          <section class="detail-section"><span class="detail-eyebrow">你原来的判断</span><p>${asset.thesis.core}</p></section>
          <section class="detail-section"><span class="detail-eyebrow">这次的新信息</span><p>${asset.analysis.facts}</p></section>
          <section class="detail-section"><span class="detail-eyebrow">当前影响</span><p>${asset.analysis.inference}</p></section>
          <section class="detail-section"><span class="detail-eyebrow">你的选择</span><p>保持原判断不会删除这次证据。修改时，原版本仍会保留在历史记录中。</p>
            <div class="button-row">
              <button class="primary-button pressable" type="button" data-toast="已保留原判断，并记录本次证据">保持原判断</button>
              <button class="secondary-button pressable" type="button" data-edit-thesis>修改观察项</button>
              <button class="secondary-button pressable" type="button" data-toast="已设为稍后处理">稍后再看</button>
            </div>
          </section>
        `
      );
    }

    function assetsSheet() {
      return sheetFrame(
        "管理标的",
        "动态只使用你主动添加的持仓和自选标的，不会根据浏览记录推断持仓。",
        `<div>${Object.values(assets).map(asset => `
          <div class="managed-asset">
            <span class="asset-avatar ${asset.avatarClass}">${asset.short}</span>
            <span><strong>${asset.name}</strong><small>${asset.kind} · ${asset.code}</small></span>
            <button class="switch pressable" type="button" role="switch" aria-checked="true" aria-label="${asset.name}动态提醒"></button>
          </div>
        `).join("")}</div>
        <div class="button-row"><button class="primary-button pressable" type="button" data-toast="原型中已模拟添加入口">添加持仓或自选</button></div>`
      );
    }

    function settingsSheet() {
      return sheetFrame(
        "设置",
        "你可以随时调整提醒和数据使用范围。所有开关仅改变当前原型状态。",
        `
          <div class="setting-row"><span class="setting-copy"><strong>重要动态提醒</strong><span>仅在相关、重要且证据充分时提醒</span></span><button class="switch pressable" type="button" role="switch" aria-checked="true" aria-label="重要动态提醒"></button></div>
          <div class="setting-row"><span class="setting-copy"><strong>免打扰</strong><span>22:00 至次日 08:00</span></span><button class="switch pressable" type="button" role="switch" aria-checked="true" aria-label="免打扰"></button></div>
          <div class="setting-row"><span class="setting-copy"><strong>只使用主动添加的标的</strong><span>不根据浏览行为推断持仓</span></span><button class="switch pressable" type="button" role="switch" aria-checked="true" aria-label="只使用主动添加的标的"></button></div>
          <section class="detail-section"><span class="detail-eyebrow">数据状态</span><p>当前使用模拟数据。未连接券商账户，也未授权任何真实持仓数据。</p></section>
        `
      );
    }

    function renderSheet(view = state.sheetView) {
      const asset = assets[state.assetId];
      const safeView = view || { type: "archive", tab: "thesis" };
      const content = {
        archive: () => researchArchiveSheet(asset, safeView.tab || "thesis", safeView.traceId || "primary"),
        metric: () => marketSheet(asset, safeView.metricKey || "price", safeView.period || state.chartPeriod),
        trace: () => reasoningSheet(asset, safeView.traceId || "primary"),
        source: () => sourceDetailSheet(asset, safeView.sourceId),
        evidence: () => researchArchiveSheet(asset, "sources"),
        thesis: () => researchArchiveSheet(asset, "thesis"),
        impact: () => impactSheet(asset),
        assets: () => assetsSheet(),
        settings: () => settingsSheet(),
        editThesis: () => thesisSheet(asset, true)
      };
      sheet.innerHTML = (content[safeView.type] || content.archive)();
    }

    function openSheet(type, trigger = document.activeElement) {
      lastTrigger = trigger instanceof HTMLElement ? trigger : null;
      state.sheetHistory = [];
      state.sheetView = type === "evidence" ? { type: "archive", tab: "sources" }
        : type === "thesis" ? { type: "archive", tab: "thesis" }
        : { type };
      renderSheet();
      sheet.classList.add("is-open");
      sheet.setAttribute("aria-hidden", "false");
      closeAssetPopover();
      requestAnimationFrame(() => sheet.querySelector("#sheet-title")?.focus());
    }

    function navigateSheet(view, trigger = document.activeElement, pushHistory = true) {
      if (!sheet.classList.contains("is-open")) {
        lastTrigger = trigger instanceof HTMLElement ? trigger : null;
        state.sheetHistory = [];
        sheet.classList.add("is-open");
        sheet.setAttribute("aria-hidden", "false");
      } else if (pushHistory && state.sheetView) {
        state.sheetHistory.push({ ...state.sheetView });
      }
      state.sheetView = view;
      renderSheet();
      requestAnimationFrame(() => sheet.querySelector("#sheet-title")?.focus());
    }

    function backSheet() {
      const previous = state.sheetHistory.pop();
      if (!previous) return;
      state.sheetView = previous;
      renderSheet();
      requestAnimationFrame(() => sheet.querySelector("#sheet-title")?.focus());
    }

    function closeSheet() {
      if (!sheet.classList.contains("is-open")) return;
      sheet.classList.remove("is-open");
      sheet.setAttribute("aria-hidden", "true");
      state.sheetHistory = [];
      state.sheetView = null;
      if (lastTrigger?.isConnected) lastTrigger.focus();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("is-visible");
      toastTimer = setTimeout(() => toast.classList.remove("is-visible"), 2200);
    }

    function saveThesis() {
      const value = sheet.querySelector("#thesis-core")?.value.trim();
      if (!value) {
        showToast("判断内容不能为空");
        return;
      }
      assets[state.assetId].thesis.core = value;
      assets[state.assetId].thesis.state = "已由你确认";
      state.sheetView = { type: "archive", tab: "thesis" };
      renderSheet();
      showToast("我的判断已更新");
    }

    function getTourComplete() {
      try {
        return sessionStorage.getItem(tourStorageKey) === "1";
      } catch {
        return false;
      }
    }

    function setTourComplete() {
      try {
        sessionStorage.setItem(tourStorageKey, "1");
      } catch {
        // file:// environments may block storage; the tour still remains usable.
      }
    }

    function renderTourPopover() {
      const step = tourSteps[tourIndex];
      const isLast = tourIndex === tourSteps.length - 1;
      tourPopover.innerHTML = `
        <div class="tour-step">${tourIndex + 1} / ${tourSteps.length}</div>
        <h2 class="tour-title" id="tour-title">${step.title}</h2>
        <p class="tour-body" id="tour-body">${step.body}</p>
        <div class="tour-actions">
          <button class="tour-skip pressable" type="button" data-tour-skip>跳过</button>
          ${tourIndex > 0 ? '<button class="tour-back pressable" type="button" data-tour-prev>上一步</button>' : '<span aria-hidden="true"></span>'}
          <button class="tour-next pressable" type="button" data-tour-next>${isLast ? "开始使用" : "下一步"}</button>
        </div>
      `;
    }

    function setFixedRect(element, left, top, width, height) {
      element.style.left = `${Math.round(left)}px`;
      element.style.top = `${Math.round(top)}px`;
      element.style.width = `${Math.max(0, Math.round(width))}px`;
      element.style.height = `${Math.max(0, Math.round(height))}px`;
    }

    function positionTour() {
      if (!tourActive) return;
      const step = tourSteps[tourIndex];
      const target = document.querySelector(step.target);
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const gap = 10;
      const left = Math.max(8, rect.left - gap);
      const top = Math.max(8, rect.top - gap);
      const right = Math.min(window.innerWidth - 8, rect.right + gap);
      const bottom = Math.min(window.innerHeight - 8, rect.bottom + gap);
      const width = right - left;
      const height = bottom - top;

      setFixedRect(tourMasks.top, 0, 0, window.innerWidth, top);
      setFixedRect(tourMasks.left, 0, top, left, height);
      setFixedRect(tourMasks.right, right, top, window.innerWidth - right, height);
      setFixedRect(tourMasks.bottom, 0, bottom, window.innerWidth, window.innerHeight - bottom);
      setFixedRect(tourFocusRing, left, top, width, height);
      setFixedRect(tourBlocker, left, top, width, height);

      const bubbleRect = tourPopover.getBoundingClientRect();
      const bubbleWidth = bubbleRect.width || Math.min(324, window.innerWidth - 32);
      const bubbleHeight = bubbleRect.height || 190;
      const edge = 16;
      const spacing = 18;
      const canPlaceBelow = bottom + spacing + bubbleHeight <= window.innerHeight - edge;
      const placement = canPlaceBelow ? "bottom" : "top";
      const bubbleTop = canPlaceBelow
        ? bottom + spacing
        : Math.max(edge, top - spacing - bubbleHeight);
      const idealLeft = left + width / 2 - bubbleWidth / 2;
      const bubbleLeft = Math.max(edge, Math.min(idealLeft, window.innerWidth - bubbleWidth - edge));
      const arrowLeft = Math.max(26, Math.min(left + width / 2 - bubbleLeft, bubbleWidth - 26));

      tourPopover.style.left = `${Math.round(bubbleLeft)}px`;
      tourPopover.style.top = `${Math.round(bubbleTop)}px`;
      tourPopover.style.setProperty("--tour-arrow-left", `${Math.round(arrowLeft)}px`);
      tourPopover.dataset.placement = placement;
    }

    function showTourStep(index) {
      if (!tourActive) return;
      tourIndex = Math.max(0, Math.min(index, tourSteps.length - 1));
      const target = document.querySelector(tourSteps[tourIndex].target);
      if (!target) {
        if (tourIndex < tourSteps.length - 1) showTourStep(tourIndex + 1);
        else finishTour(false);
        return;
      }

      const targetRect = target.getBoundingClientRect();
      const isOutsideViewport = targetRect.top < 8 || targetRect.bottom > window.innerHeight - 8;
      if (isOutsideViewport && !target.closest(".topbar") && !target.closest(".composer-dock")) {
        target.scrollIntoView({ block: "center", behavior: "smooth" });
      }

      renderTourPopover();
      requestAnimationFrame(() => {
        positionTour();
        tourPopover.querySelector("[data-tour-next]")?.focus();
      });
    }

    function startTour(force = false) {
      if (tourActive || (!force && getTourComplete())) return;
      clearTimeout(tourCloseTimer);
      tourReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
      closeAssetPopover();
      closeSheet();
      tourActive = true;
      tourIndex = 0;
      tourLayer.hidden = false;
      appShell.inert = true;
      renderTourPopover();
      positionTour();
      requestAnimationFrame(() => {
        tourLayer.classList.add("is-active");
        tourPopover.querySelector("[data-tour-next]")?.focus();
      });
    }

    function finishTour(completed = true) {
      if (!tourActive) return;
      tourActive = false;
      appShell.inert = false;
      tourLayer.classList.remove("is-active");
      if (completed) setTourComplete();
      tourCloseTimer = setTimeout(() => {
        tourLayer.hidden = true;
        if (tourReturnFocus?.isConnected) tourReturnFocus.focus();
      }, 190);
    }

    function trapTourFocus(event) {
      if (event.key !== "Tab") return;
      const controls = [...tourPopover.querySelectorAll("button:not([disabled])")];
      if (!controls.length) return;
      const first = controls[0];
      const last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }

    composer.addEventListener("submit", event => {
      event.preventDefault();
      ask(promptInput.value);
      promptInput.value = "";
      promptInput.style.height = "auto";
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = `${Math.min(promptInput.scrollHeight, 128)}px`;
    });

    promptInput.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        composer.requestSubmit();
      }
    });

    assetSwitcher.addEventListener("click", () => state.popoverOpen ? closeAssetPopover() : openAssetPopover());

    document.addEventListener("click", event => {
      const assetButton = event.target.closest("[data-asset]");
      const promptButton = event.target.closest("[data-prompt]");
      const analysisButton = event.target.closest("[data-analysis-toggle]");
      const sheetButton = event.target.closest("[data-sheet]");
      const closeSheetButton = event.target.closest("[data-close-sheet]");
      const switchButton = event.target.closest(".switch");
      const startTourButton = event.target.closest("[data-start-tour]");
      if (startTourButton) startTour(true);
      if (event.target.closest("[data-tour-skip]")) finishTour(true);
      if (event.target.closest("[data-tour-prev]")) showTourStep(tourIndex - 1);
      if (event.target.closest("[data-tour-next]")) {
        if (tourIndex === tourSteps.length - 1) finishTour(true);
        else showTourStep(tourIndex + 1);
      }
      if (assetButton) selectAsset(assetButton.dataset.asset);
      if (promptButton) ask(promptButton.dataset.prompt);
      if (analysisButton) toggleAnalysis(analysisButton.dataset.analysisToggle);
      if (sheetButton) openSheet(sheetButton.dataset.sheet, sheetButton);
      if (closeSheetButton) closeSheet();
      if (event.target.closest("[data-edit-thesis]")) {
        sheet.innerHTML = thesisSheet(assets[state.assetId], true);
        requestAnimationFrame(() => sheet.querySelector("textarea")?.focus());
      }
      if (event.target.closest("[data-save-thesis]")) saveThesis();
      if (event.target.closest("[data-toast]")) showToast(event.target.closest("[data-toast]").dataset.toast);
      if (switchButton) {
        const next = switchButton.getAttribute("aria-checked") !== "true";
        switchButton.setAttribute("aria-checked", String(next));
        showToast(next ? "已开启" : "已关闭");
      }
      if (!event.target.closest(".asset-control")) closeAssetPopover();
    });

    document.addEventListener("keydown", event => {
      if (tourActive) {
        trapTourFocus(event);
        if (event.key === "Escape") finishTour(true);
        if (event.key === "ArrowRight") {
          event.preventDefault();
          if (tourIndex === tourSteps.length - 1) finishTour(true);
          else showTourStep(tourIndex + 1);
        }
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          showTourStep(tourIndex - 1);
        }
        return;
      }
      if (event.key === "Escape") {
        if (sheet.classList.contains("is-open")) closeSheet();
        else closeAssetPopover();
      }
    });

    window.addEventListener("resize", () => requestAnimationFrame(positionTour));
    conversationScroll.addEventListener("scroll", () => requestAnimationFrame(positionTour), { passive: true });

    renderConversation();
    requestAnimationFrame(() => setTimeout(() => startTour(false), 260));
  </script>
</body>
</html>
